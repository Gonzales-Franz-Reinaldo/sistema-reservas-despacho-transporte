[package]
name = "servicio-pagos"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.11"
actix-cors = "0.7"
mongodb = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
jsonwebtoken = "9"
futures = "0.3"
derive_more = "0.99"
# Si luego conectas RabbitMQ, descomenta lapin:
# lapin = { version = "2", features = ["rustls"] }
